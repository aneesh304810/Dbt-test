version: 2

sources:
  - name: sei_raw
    description: |
      Raw data from the SEI accounting platform (system of record).
      
      **Data Quality Expectations:**
      - Primary keys must be unique and not null
      - All active securities must have valid asset classifications
      - Reference tables must be complete and consistent
    
    meta:
      owner: "sei_integration"
      refresh_frequency: "daily"
      data_sla: "9:00 AM ET"
    
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    
    loaded_at_field: "_loaded_at"
    
    schema: "{{ var('sei_schema', 'raw_sei') }}"

    tables:
      - name: securities
        description: |
          SEI securities master table containing all security master data.
          This is the primary source of truth for security identifiers and attributes.
        
        meta:
          row_count_expected: ">= 1000"
        
        tests:
          # Table-level tests
          - dbt_utils.expression_is_true:
              expression: "COUNT(*) > 0"
              name: securities_table_not_empty
          
          # Check for reasonable data volume
          - dbt_expectations.expect_table_row_count_to_be_between:
              min_value: 100
              max_value: 1000000
              config:
                severity: warn
          
          # Check that active securities dominate
          - dbt_utils.expression_is_true:
              expression: "(SELECT COUNT(*) FROM {{ source('sei_raw', 'securities') }} WHERE status_flag = 'A') > 0"
              name: at_least_one_active_security
        
        columns:
          - name: sec_id
            description: "Unique security identifier (primary key)"
            tests:
              - unique
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 50
          
          - name: sec_name
            description: "Security name"
            tests:
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 200
          
          - name: cusip_num
            description: "CUSIP identifier (9 characters)"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_equal:
                  value: 9
                  config:
                    where: "cusip_num is not null"
              - dbt_expectations.expect_column_values_to_match_regex:
                  regex: "^[A-Z0-9]{9}$"
                  config:
                    where: "cusip_num is not null"
          
          - name: isin_code
            description: "ISIN identifier (12 characters)"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_equal:
                  value: 12
                  config:
                    where: "isin_code is not null"
          
          - name: sedol_code
            description: "SEDOL identifier (7 characters)"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_equal:
                  value: 7
                  config:
                    where: "sedol_code is not null"
          
          - name: ticker_sym
            description: "Ticker symbol"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 20
                  config:
                    where: "ticker_sym is not null"
          
          - name: sec_type_code
            description: "Security type code"
            tests:
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 2
                  max_value: 20
          
          - name: asset_cls_code
            description: "SEI asset class code (must join to asset_classes table)"
            tests:
              - not_null
              - relationships:
                  to: source('sei_raw', 'asset_classes')
                  field: asset_cls_code
                  name: asset_class_code_valid
          
          - name: sub_asset_cls_code
            description: "SEI sub-asset class code"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 50
                  config:
                    where: "sub_asset_cls_code is not null"
          
          - name: currency_code
            description: "Currency code (should be ISO 4217)"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_equal:
                  value: 3
                  config:
                    where: "currency_code is not null"
              - dbt_expectations.expect_column_values_to_match_regex:
                  regex: "^[A-Z]{3}$"
                  config:
                    where: "currency_code is not null"
          
          - name: country_code
            description: "Country code (should be ISO 3166-1 alpha-2)"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_equal:
                  value: 2
                  config:
                    where: "country_code is not null"
              - dbt_expectations.expect_column_values_to_match_regex:
                  regex: "^[A-Z]{2}$"
                  config:
                    where: "country_code is not null"
          
          - name: issuer_name
            description: "Issuer name"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 200
                  config:
                    where: "issuer_name is not null"
          
          - name: maturity_dt
            description: "Maturity date for fixed income"
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: "'1900-01-01'"
                  max_value: "'2100-12-31'"
                  config:
                    where: "maturity_dt is not null"
          
          - name: coupon_rate
            description: "Coupon rate (decimal)"
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0
                  max_value: 0.50
                  config:
                    where: "coupon_rate is not null"
                    severity: warn
          
          - name: price_amt
            description: "Latest price"
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0
                  max_value: 1000000
                  config:
                    where: "price_amt is not null"
                    severity: warn
          
          - name: price_dt
            description: "Price date"
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: "'2020-01-01'"
                  max_value: "CURRENT_DATE"
                  config:
                    where: "price_dt is not null"
                    severity: warn
          
          - name: mkt_cap_amt
            description: "Market capitalization"
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0
                  max_value: 10000000000000
                  config:
                    where: "mkt_cap_amt is not null"
                    severity: warn
          
          - name: sector_code
            description: "Industry sector code"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 50
                  config:
                    where: "sector_code is not null"
          
          - name: status_flag
            description: "Status flag (A=Active, I=Inactive)"
            tests:
              - accepted_values:
                  values: ['A', 'I', 'P', 'D']
              - dbt_expectations.expect_column_values_to_be_in_set:
                  value_set: ['A', 'I', 'P', 'D']

      - name: asset_classes
        description: |
          SEI asset class hierarchy reference table.
          Defines the classification taxonomy used by SEI.
        
        tests:
          # Ensure the reference table is not empty
          - dbt_utils.expression_is_true:
              expression: "COUNT(*) > 0"
              name: asset_classes_table_not_empty
          
          # Check for reasonable reference data size
          - dbt_expectations.expect_table_row_count_to_be_between:
              min_value: 10
              max_value: 1000
              config:
                severity: warn
        
        columns:
          - name: asset_cls_code
            description: "Asset class code (primary key)"
            tests:
              - unique
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 50
          
          - name: asset_cls_name
            description: "Asset class name"
            tests:
              - not_null
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 200
          
          - name: parent_cls_code
            description: "Parent asset class code (for hierarchy)"
            tests:
              - relationships:
                  to: source('sei_raw', 'asset_classes')
                  field: asset_cls_code
                  config:
                    where: "parent_cls_code is not null"
                  name: parent_code_is_valid_asset_class
          
          - name: hierarchy_level
            description: "Hierarchy level (1=top, 2=sub, etc.)"
            tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 1
                  max_value: 10
          
          - name: is_active
            description: "Whether this class is active"
            tests:
              - accepted_values:
                  values: [true, false, 'Y', 'N', 1, 0]

      - name: security_classifications
        description: |
          SEI security-to-classification junction table.
          Links securities to their classification codes.
        
        tests:
          # Check junction table has data
          - dbt_utils.expression_is_true:
              expression: "COUNT(*) > 0"
              name: security_classifications_not_empty
        
        columns:
          - name: sec_id
            description: "Security ID (foreign key)"
            tests:
              - not_null
              - relationships:
                  to: source('sei_raw', 'securities')
                  field: sec_id
                  name: sec_id_exists_in_securities
          
          - name: classification_code
            description: "Classification code"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 50
                  config:
                    where: "classification_code is not null"
          
          - name: classification_type
            description: "Type of classification"
            tests:
              - dbt_expectations.expect_column_value_lengths_to_be_between:
                  min_value: 1
                  max_value: 50
                  config:
                    where: "classification_type is not null"
